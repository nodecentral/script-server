services:
  script-server:
    build:
      context: .
      dockerfile: tools/Dockerfile
    image: script-server:local
    container_name: script-server
    restart: unless-stopped
    # A plain ZIP download (as opposed to a git clone) does not preserve the
    # execute bit on scripts/*.sh, and script-server silently fails to run
    # (or greys out) anything that isn't executable. Fix it on every
    # container start, after the bind mounts below are in place.
    entrypoint: ["/bin/sh", "-c", "chmod -R +x /app/scripts 2>/dev/null; exec python3 launcher.py"]
    # Host networking so nmap/arp-scan (used by the Network Scanner runner) can
    # actually see the real LAN, instead of just Docker's internal bridge
    # network. Trade-off: the container shares the host's network stack
    # directly - there's no isolation, and no port mapping to configure
    # (the app listens on port 5000 on the NAS itself). Only supported on
    # Linux Docker hosts (which QNAP/Container Station is).
    network_mode: host
    # Raw-socket privileges so nmap/arp-scan can actually send/receive ARP
    # frames and resolve MAC addresses on active scans - Docker's default
    # capability set doesn't include these even for a container running as
    # root. Narrower than network_mode: host: just these two privileges,
    # not full container isolation removal.
    cap_add:
      - NET_RAW
      - NET_ADMIN
    # Every custom operating-file requirement lives on an explicit host
    # bind mount under /share/... -- nothing container-local, nothing
    # relative to this compose file's own location. This is the template
    # for future installations, not a live migration: /share/... paths
    # are the intended layout, not a reflection of any already-populated
    # data (see individual ss_* repo READMEs for what each path holds).
    volumes:
      - /share/conf:/app/conf
      - /share/logs:/app/logs
      - /share/scripts:/app/scripts
      - /share/data:/app/data
      # Read-only media/data library mounts for the ss_* sibling repos
      # (ss_health_management, ss_movie_file_management,
      # ss_music_file_management, ss_photo_file_management). Each repo's
      # own README documents its container-side path convention; these are
      # the host side of that convention. Catalog/audit output for the
      # movie/music/photo repos already lands under the /share/data:/app/data
      # mount above (no separate entry needed) - only the read-only
      # library paths below were missing.
      - /share/health:/app/health
      - /share/movies:/app/movies
      - /share/pictures:/app/pictures
      - /share/music:/app/music
