services:
  script-server:
    build:
      context: .
      dockerfile: tools/Dockerfile
    image: script-server:local
    container_name: script-server
    restart: unless-stopped
    # A plain ZIP download (as opposed to a git clone) does not preserve the
    # execute bit on scripts/*.sh, and script-server silently fails to run
    # (or greys out) anything that isn't executable. Fix it on every
    # container start, after the bind mounts below are in place.
    entrypoint: ["/bin/sh", "-c", "chmod -R +x /app/scripts 2>/dev/null; exec python3 launcher.py"]
    # Host networking so nmap/arp-scan (used by the Network Scanner runner) can
    # actually see the real LAN, instead of just Docker's internal bridge
    # network. Trade-off: the container shares the host's network stack
    # directly - there's no isolation, and no port mapping to configure
    # (the app listens on port 5000 on the NAS itself). Only supported on
    # Linux Docker hosts (which QNAP/Container Station is).
    network_mode: host
    # Raw-socket privileges so nmap/arp-scan can actually send/receive ARP
    # frames and resolve MAC addresses on active scans - Docker's default
    # capability set doesn't include these even for a container running as
    # root. Narrower than network_mode: host: just these two privileges,
    # not full container isolation removal.
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - ./conf:/app/conf
      - ./logs:/app/logs
      - ./scripts:/app/scripts
      - ./data:/app/data
